                  - !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default"
                  - !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/harness_anycompany_orchestrator-*"
              - Sid: AgentCoreApiKeyTokenVaultPerKey
                Effect: Allow
                Action: bedrock-agentcore:GetResourceApiKey
                Resource: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default/apikeycredentialprovider/anycompany-orchestrator-model-key"
              - Sid: AgentCoreApiKeySecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bedrock-agentcore-identity!default/apikey/anycompany-orchestrator-model-key-*"

