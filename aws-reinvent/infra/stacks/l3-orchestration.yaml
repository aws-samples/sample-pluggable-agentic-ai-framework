  # ===========================================================================
  # Couchbase egress: a fixed outbound IP for the Refund tools Lambda.
  # When the participant picks Couchbase in L1, the Refund Lambda runs in this
  # private subnet and reaches Capella through the NAT gateway's Elastic IP,
  # which L1 adds to the Capella allowlist (one /32, never 0.0.0.0/0).
  # Built in the account's default VPC; the Bedrock KB path does not use it.
  # ===========================================================================
  CouchbaseEgressLookupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DescribeDefaultVpc
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                Resource: "*"   # Describe* actions do not support resource-level permissions
  CouchbaseEgressLookupFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Return the default VPC, its CIDR, and one public default subnet (Couchbase egress)
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 30
      Role: !GetAtt CouchbaseEgressLookupRole.Arn
      Code:
        ZipFile: |
          import json, urllib.request, boto3
          def _send(event, context, status, data=None, reason=None):
              body = json.dumps({
                  "Status": status, "Reason": reason or context.log_stream_name,
                  "PhysicalResourceId": event.get("PhysicalResourceId") or "couchbase-egress-lookup",
                  "StackId": event["StackId"], "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"], "Data": data or {},
              }).encode("utf-8")
              req = urllib.request.Request(event["ResponseURL"], data=body, method="PUT",
                                           headers={"content-type": "", "content-length": str(len(body))})
              urllib.request.urlopen(req)
          def lambda_handler(event, context):
              try:
                  if event["RequestType"] == "Delete":
                      return _send(event, context, "SUCCESS")
                  ec2 = boto3.client("ec2")
                  vpc = ec2.describe_vpcs(Filters=[{"Name": "is-default", "Values": ["true"]}])["Vpcs"][0]
                  subnets = ec2.describe_subnets(Filters=[
                      {"Name": "vpc-id", "Values": [vpc["VpcId"]]},
                      {"Name": "default-for-az", "Values": ["true"]}])["Subnets"]
                  public = sorted(subnets, key=lambda s: s["AvailabilityZone"])[0]
                  _send(event, context, "SUCCESS", {
                      "VpcId": vpc["VpcId"], "VpcCidr": vpc["CidrBlock"],
                      "PublicSubnetId": public["SubnetId"], "AvailabilityZone": public["AvailabilityZone"]})
              except Exception as e:
                  _send(event, context, "FAILED", reason=f"Default VPC lookup failed: {e}")
  CouchbaseEgressLookup:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt CouchbaseEgressLookupFunction.Arn
      ServiceTimeout: 300
  CouchbaseEgressSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !GetAtt CouchbaseEgressLookup.VpcId
      AvailabilityZone: !GetAtt CouchbaseEgressLookup.AvailabilityZone
      # The last /24 of the default VPC (172.31.255.0/24); default subnets use the low /20s.
      CidrBlock: !Select [255, !Cidr [!GetAtt CouchbaseEgressLookup.VpcCidr, 256, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: anycompany-couchbase-egress
  CouchbaseEgressEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: anycompany-couchbase-egress
  CouchbaseEgressNat:
    Type: AWS::EC2::NatGateway
    Properties:
      SubnetId: !GetAtt CouchbaseEgressLookup.PublicSubnetId
      AllocationId: !GetAtt CouchbaseEgressEip.AllocationId
      Tags:
        - Key: Name
          Value: anycompany-couchbase-egress
  CouchbaseEgressRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !GetAtt CouchbaseEgressLookup.VpcId
      Tags:
        - Key: Name
          Value: anycompany-couchbase-egress
  CouchbaseEgressRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref CouchbaseEgressRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref CouchbaseEgressNat
  CouchbaseEgressRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref CouchbaseEgressSubnet
      RouteTableId: !Ref CouchbaseEgressRouteTable
  CouchbaseEgressSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Refund tools Lambda (Couchbase option) - outbound only, no inbound rules
      VpcId: !GetAtt CouchbaseEgressLookup.VpcId
      SecurityGroupEgress:
        # Outbound only, through the NAT gateway: AWS APIs (SSM, Bedrock) and Capella.
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to AWS APIs and Capella
        - IpProtocol: tcp
          FromPort: 11207
          ToPort: 11207
          CidrIp: 0.0.0.0/0
          Description: Couchbase data service (TLS)
        - IpProtocol: tcp
          FromPort: 18091
          ToPort: 18096
          CidrIp: 0.0.0.0/0
          Description: Couchbase management, query and search services (TLS)
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
          Description: DNS (SRV lookup of the Capella connection string)
      Tags:
        - Key: Name
          Value: anycompany-couchbase-egress
  SsmCouchbaseEgressIp:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anycompany/agentcore/lambda_egress_ip
      Type: String
      Value: !GetAtt CouchbaseEgressEip.PublicIp
  SsmCouchbaseEgressSubnet:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anycompany/agentcore/lambda_subnet_id
      Type: String
      Value: !Ref CouchbaseEgressSubnet
  SsmCouchbaseEgressSecurityGroup:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anycompany/agentcore/lambda_sg_id
      Type: String
      Value: !GetAtt CouchbaseEgressSecurityGroup.GroupId

Outputs:

  AgentGatewayUrl:
    Description: MCP URL of the Cognito-JWT agent gateway
    Value: !GetAtt AgentGateway.GatewayUrl

  AgentGatewayArn:
    Description: ARN of the Cognito-JWT agent gateway
    Value: !GetAtt AgentGateway.GatewayArn

  HarnessGatewayArn:
    Description: ARN of the IAM-auth Harness gateway
    Value: !GetAtt HarnessGateway.GatewayArn

  CognitoUserPoolId:
    Description: AnyCompany agent Cognito user pool ID
    Value: !Ref AgentUserPool

  CognitoClientId:
    Description: AnyCompany chatbot Cognito app client ID
    Value: !Ref AgentUserPoolClient

  GatewayExecutionRoleArn:
    Description: ARN of the AgentCore gateway execution role
    Value: !GetAtt GatewayExecutionRole.Arn

  RegistryId:
    Description: AnyCompany AgentCore Registry ID
    Value: !GetAtt RegistryResource.RegistryId

  RegistryArn:
    Description: AnyCompany AgentCore Registry ARN
    Value: !GetAtt RegistryResource.RegistryArn
