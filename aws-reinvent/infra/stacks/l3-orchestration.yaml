                Resource: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"
              - Sid: AgentCoreGatewayAccess
                Effect: Allow
                Action: bedrock-agentcore:InvokeGateway
                Resource: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*"
              # A Bedrock orchestrator model uses BedrockModelInvocation above. A partner
              # model (Baseten) runs through liteLlmModelConfig and
              # authenticates with an API key that 3_orchestrator_agent.ipynb stores in the
              # AgentCore Identity credential provider "anycompany-orchestrator-model-key".
              # These statements let the Harness read THAT key only, per
              # https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-security.html
              - Sid: AgentCoreApiKeyTokenVaultDefault
